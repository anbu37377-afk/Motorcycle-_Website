<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon Bikes | Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <div class="glass auth-card">
      <a class="auth-brand" href="index.html" aria-label="Horizon Bikes Home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="brand-name">Horizon Bikes</span>
      </a>
      <h1>Create Account</h1>
      <p class="auth-subtitle">Build your Horizon Bikes ID.</p>

      <form class="form-grid needs-validation auth-form" novalidate>
        <div class="form-row auth-row-stack">
          <div class="input-group">
            <label for="register-name">Full Name</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <path d="M4 20c1.8-3 4.6-4 8-4s6.2 1 8 4" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
              </span>
              <input class="input" id="register-name" name="name" type="text" placeholder="Full name" required />
            </div>
          </div>
          <div class="input-group">
            <label for="register-email">Email</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                  <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
              </span>
              <input class="input" id="register-email" name="email" type="email" placeholder="you@horizonbikes.com" required />
            </div>
          </div>
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M6 10h12v10H6z" stroke="currentColor" stroke-width="1.6" fill="none" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" fill="none" />
              </svg>
            </span>
            <input class="input" id="register-password" name="password" type="password" placeholder="Create password" required />
          </div>
        </div>
        <p class="form-message" aria-live="polite"></p>
        <button class="btn auth-primary" type="submit">Create Account</button>
      </form>

      <p class="auth-note">Already have an account? <a class="auth-link" href="login.html">Log In</a></p>
      <div class="auth-divider"><span>OR</span></div>
      <div class="auth-social-grid">
        <button class="btn btn-outline auth-social" type="button">
          <span class="social-dot">G</span>
          <span>Google</span>
        </button>
        <button class="btn btn-outline auth-social" type="button">
          <span class="social-dot">f</span>
          <span>Facebook</span>
        </button>
      </div>
      <a class="auth-back" href="index.html">Back to Home</a>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
