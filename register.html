<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon Bikes | Register</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

  <div class="auth-theme-toggle">
    <button class="icon-btn theme-toggle" id="theme-toggle-auth" type="button" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      </svg>
    </button>
  </div>

  <main class="auth-wrapper">
    <div class="glass auth-card">
      <a class="auth-brand" href="index.html" aria-label="Horizon Bikes Home">
        <div class="logo-mark" aria-hidden="true"></div>
        <span class="brand-name">Horizon Bikes</span>
      </a>
      <h1>Create Account</h1>
      <p class="auth-subtitle">Build your Horizon Bikes ID.</p>

      <form class="form-grid needs-validation auth-form" novalidate>
        <div class="form-row auth-row-stack">
          <div class="input-group">
            <label for="register-name">Full Name</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <path d="M4 20c1.8-3 4.6-4 8-4s6.2 1 8 4" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
              </span>
              <input class="input" id="register-name" name="name" type="text" placeholder="Full name" required />
            </div>
          </div>
          <div class="input-group">
            <label for="register-email">Email</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                  <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
              </span>
              <input class="input" id="register-email" name="email" type="email" placeholder="you@horizonbikes.com"
                required />
            </div>
          </div>
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M6 10h12v10H6z" stroke="currentColor" stroke-width="1.6" fill="none" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" fill="none" />
              </svg>
            </span>
            <input class="input" id="register-password" name="password" type="password" placeholder="Create password"
              required />
          </div>
        </div>
        <p class="form-message" aria-live="polite"></p>
        <button class="btn auth-primary" type="submit">Create Account</button>
      </form>

      <p class="auth-note">Already have an account? <a class="auth-link" href="login.html">Log In</a></p>
      <div class="auth-divider"><span>OR</span></div>
      <div class="auth-social-grid">
        <button class="btn btn-outline auth-social" type="button">
          <span class="social-dot">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853" />
              <path
                d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94L5.84 14.1z"
                fill="#FBBC05" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                fill="#EA4335" />
            </svg>
          </span>
          <span>Google</span>
        </button>
        <button class="btn btn-outline auth-social" type="button">
          <span class="social-dot">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
          </span>
          <span>Facebook</span>
        </button>
      </div>
      <a class="auth-back" href="index.html">Back to Home</a>
    </div>
  </main>

  <script src="main.js"></script>
</body>

</html>
